# apps/backend/wrangler.toml — Cloudflare Worker API
name = "holding-backend"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

[vars]
ALLOWED_ORIGIN = "http://localhost:4321"
HMAC_SECRET = "dev-hmac-secret-do-not-use-in-production"
POSTMARK_API_TOKEN = ""

[[durable_objects.bindings]]
name = "WEBSOCKET_SERVER"
class_name = "WebSocketHibernationServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebSocketHibernationServer"]

[[d1_databases]]
binding = "DB"
database_name = "holding-dev"
database_id = "local-dev"
migrations_dir = "../../prisma/migrations"

[env.preview]
name = "holding-backend-preview"
[env.preview.vars]
ALLOWED_ORIGIN = "https://preview.production.city"
# HMAC_SECRET must be set via `wrangler secret put HMAC_SECRET --env preview`
# POSTMARK_API_TOKEN must be set via `wrangler secret put POSTMARK_API_TOKEN --env preview`
[[env.preview.durable_objects.bindings]]
name = "WEBSOCKET_SERVER"
class_name = "WebSocketHibernationServer"
[[env.preview.d1_databases]]
binding = "DB"
database_name = "holding-preview"
database_id = "61f78701-4ff5-4808-8d05-c1be66d984ec"
migrations_dir = "../../prisma/migrations"

[env.staging]
name = "holding-backend-staging"
[env.staging.vars]
ALLOWED_ORIGIN = "https://staging.production.city"
# HMAC_SECRET must be set via `wrangler secret put HMAC_SECRET --env staging`
# POSTMARK_API_TOKEN must be set via `wrangler secret put POSTMARK_API_TOKEN --env staging`
[[env.staging.durable_objects.bindings]]
name = "WEBSOCKET_SERVER"
class_name = "WebSocketHibernationServer"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "holding-staging"
database_id = "527c2f52-144b-422f-aa16-46e5b86cdd9f"
migrations_dir = "../../prisma/migrations"

[env.production]
name = "holding-backend-production"
[[env.production.durable_objects.bindings]]
name = "WEBSOCKET_SERVER"
class_name = "WebSocketHibernationServer"

[env.production.vars]
ALLOWED_ORIGIN = "https://production.city"
# HMAC_SECRET must be set via `wrangler secret put HMAC_SECRET --env production`
# POSTMARK_API_TOKEN must be set via `wrangler secret put POSTMARK_API_TOKEN --env production`

[[env.production.routes]]
pattern = "api.production.city/*"
zone_name = "production.city"

[[env.production.d1_databases]]
binding = "DB"
database_name = "holding-production"
database_id = "2b77f155-690e-4368-800d-ee52e7796d81"
migrations_dir = "../../prisma/migrations"
