# apps/workers/wrangler.toml — Cloudflare Queue Workers + Cron Triggers
name = "holding-workers"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

[vars]
# HUBSPOT_ACCESS_TOKEN must be set via `wrangler secret put HUBSPOT_ACCESS_TOKEN --env <env>`
HUBSPOT_ACCESS_TOKEN = ""

# D1 database binding for cleanup operations
[[d1_databases]]
binding = "DB"
database_name = "holding-dev"
database_id = "local-dev"
migrations_dir = "../../prisma/migrations"

# Cron Trigger: daily cleanup at 03:00 UTC
[triggers]
crons = ["0 3 * * *"]

[[queues.consumers]]
queue = "holding-jobs"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "holding-jobs-dlq"

[env.preview]
name = "holding-workers-preview"
[[env.preview.d1_databases]]
binding = "DB"
database_name = "holding-preview"
database_id = "61f78701-4ff5-4808-8d05-c1be66d984ec"
migrations_dir = "../../prisma/migrations"
[[env.preview.queues.consumers]]
queue = "holding-jobs-preview"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "holding-jobs-dlq-preview"

[env.staging]
