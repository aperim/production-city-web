openapi: "3.1.0"
info:
  title: Production City API
  version: "0.1.0"
  description: Production City backend API served by Cloudflare Workers
paths:
  /live:
    get:
      summary: Liveness probe
      description: Returns 200 if the service is running. No database dependency.
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /ready:
    get:
      summary: Readiness probe
      description: Returns 200 if the service is ready and database is reachable.
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: ok
        "503":
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /docs:
    get:
      summary: OpenAPI specification
      description: Returns the OpenAPI 3.1 specification as JSON.
      responses:
        "200":
          description: OpenAPI spec
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
        error:
          type: string
      required:
        - status
