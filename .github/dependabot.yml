version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "type: infrastructure"
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      prisma:
        patterns: ["@prisma/*", "prisma"]
      react:
        patterns: ["react", "react-dom", "@types/react*", "@vitejs/*", "vite", "tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "type: infrastructure"
