name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Apply D1 migrations (staging)
        working-directory: apps/backend
        run: pnpm exec wrangler d1 migrations apply DB --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations to local DB for seeding
        run: |
          set -euo pipefail
          for migration in prisma/migrations/*.sql; do
            echo "Applying $migration ..."
            sqlite3 local.db < "$migration"
          done
          echo "Local DB tables:"
          sqlite3 local.db ".tables"

      - name: Seed database (staging only)
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_ENV}" == "production" ]]; then
            echo "ERROR: Refusing to seed in production context"
            exit 1
          fi
          if [[ "${NODE_ENV}" == "production" ]]; then
            echo "ERROR: Refusing to seed in production context"
            exit 1
          fi
          pnpm db:seed
        env:
          NODE_ENV: staging
          DEPLOY_ENV: staging
          DATABASE_URL: "file:./local.db"
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}

      - name: Apply seed data to remote D1 staging
        working-directory: apps/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Export INSERT OR REPLACE statements from the seeded local.db in
          # foreign-key dependency order and apply them to the remote D1
          # staging database.  INSERT OR REPLACE makes the operation idempotent.
          {
            printf "PRAGMA defer_foreign_keys = ON;\n\n"
            # Keep this list in sync with the tables seeded in prisma/seed-logic.ts.
            # Add any new seeded tables here in foreign-key dependency order.
            for TABLE in Role Permission AnnouncementCategory User \
                         RolePermission UserRole NotificationPreference \
                         feature_notifications; do
              printf -- "-- %s\n" "$TABLE"
              sqlite3 ../../local.db ".mode insert $TABLE" \
                "SELECT * FROM \"$TABLE\";" 2>/dev/null \
                | sed 's/^INSERT INTO /INSERT OR REPLACE INTO /'
              printf "\n"
            done
          } > ../../seed-remote.sql
          echo "Seed SQL generated: $(wc -l < ../../seed-remote.sql) lines"
          pnpm exec wrangler d1 execute DB --remote --env staging \
            --file ../../seed-remote.sql

      - name: Build shared packages
        run: |
          pnpm --filter ./packages/design-tokens build
          pnpm --filter ./packages/ui build

      - name: Build all apps
        run: |
          pnpm --filter ./apps/web... build
          pnpm --filter ./apps/backend... build
          pnpm --filter ./apps/workers... build

      - name: Validate CSP hashes
        run: node --experimental-transform-types --experimental-detect-module scripts/validate-csp-hashes.ts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            packages/design-tokens/dist
            packages/ui/dist
            apps/web/dist
            apps/web/app/dashboard/_generated
            apps/backend/dist
            apps/backend/src/_generated
            apps/workers/dist

    outputs:
      artifacts-uploaded: 'true'

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-test
    runs-on: ubuntu-24.04
    environment: staging

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts

      - name: Deploy web (staging)
        working-directory: apps/web
        run: pnpm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cloudflare Worker secrets (HMAC_SECRET, POSTMARK_API_TOKEN) persist
      # across deploys. Set them once via: wrangler secret put <NAME> --env staging

      - name: Deploy backend (staging)
        working-directory: apps/backend
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy workers (staging)
        working-directory: apps/workers
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-24.04
    environment: production

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Apply D1 migrations (production)
        working-directory: apps/backend
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID_PRODUCTION: ${{ secrets.CF_D1_DATABASE_ID_PRODUCTION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts

      - name: Deploy web (production)
        working-directory: apps/web
        run: pnpm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cloudflare Worker secrets (HMAC_SECRET, POSTMARK_API_TOKEN) persist
      # across deploys. Set them once via: wrangler secret put <NAME> --env production

      - name: Deploy backend (production)
        working-directory: apps/backend
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy workers (production)
        working-directory: apps/workers
        run: pnpm exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-storybook:
    name: Deploy Storybook to Cloudflare Pages
    needs: build-and-test
    runs-on: ubuntu-24.04
    environment: production

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm --filter ./packages/design-tokens build

      - name: Build Storybook
        run: pnpm --filter ./packages/ui build-storybook

      - name: Deploy Storybook to Cloudflare Pages
        working-directory: apps/backend
        run: pnpm exec wrangler pages deploy ../../packages/ui/storybook-static --project-name holding-storybook --commit-dirty true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
